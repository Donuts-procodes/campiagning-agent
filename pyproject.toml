[project]
name = "campaigning-agent"
version = "0.1.0"
description = "Campaign orchestration platform for political, advocacy, and custom outreach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "instructor>=1.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pymilvus>=2.4.0",
    "couchdb>=1.2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "websockets>=12.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"